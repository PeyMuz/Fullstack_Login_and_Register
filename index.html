<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullstack</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    
  <header>
    <a href="#" class="logo">Cyber</a>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Collection</a>
        <a href="#">Contact</a>
    </nav>

    <div class="user-auth">
         <div class="profile-box"  style="display:none">
           <div class="avatar-circle">C</div>
           <div class="dropdown">
                <a href="#">My Account</a>
                <a href="#">Logout</a>
           </div>
         </div>
        <button type="button" class="login-btn-modal">Login</button>
    </div>
  </header>

  <section class="torena">
    <h1>Let’s do our best, Trainer-san!</h1>
  </section>

  <!--For Login-->
  <div class="auth-modal">
    <button type="button" class="close-btn-modal">X</button>


     <div class="form-box login">
      <h2>Login</h2>
        <form action="">
          <div class="input-box">
            <label>Email:</label>
             <input type="email" name="email" placeholder="Please put your email here" required />
          </div>

          <div class="input-box">
            <label>Password:</label>
             <input type="password" name="password" placeholder="Please put your password here" required />
          </div>

          <button type="submit" name="login_btn" class="btn">Login</button>
          <p>Don't have the account? <a href="#" class="register-link">Register</a></p>
        </form>
     </div>

     <!--Registration form-->
     <div class="form-box register">
      <h2>Register</h2>
        <form action="">
          <div class="input-box">
            <label>Name:</label>
             <input type="text" name="name" placeholder="Please put your name here" required />
          </div>

          <div class="input-box">
            <label>Email:</label>
             <input type="email" name="email" placeholder="Please put your email here" required />
          </div>

          <div class="input-box">
            <label>Password:</label>
             <input type="password" name="password" placeholder="Please put your password here" required />
          </div>

          <button type="submit" name="register_btn" class="btn">Register</button>
          <p>Already have an account? <a href="#" class="login-link">Login</a></p>
        </form>
     </div>
  </div>


  <script src="index.js"></script>
</body>
</html>
